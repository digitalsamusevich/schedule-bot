name: update-schedule

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          pip install -r requirements.txt

      - name: Fetch and recognize schedule
        run: python fetch_schedule.py --queue 6.1

      - name: Upload debug crops on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug/
            schedule_groups.jpg

      - name: Commit changes
        run: |
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if ! git diff --cached --quiet; then
            git commit -m "update schedule"
            git push
          fi
